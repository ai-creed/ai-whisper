name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: lint · build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      # ai-whisper depends on @ai-ezio/harness + @ai-ezio/protocol + @ai-ezio/surface
      # via file:../ai-ezio/packages/* (see package.json). Both repos are checked out
      # side-by-side inside the workspace so those relative paths resolve, mirroring
      # the local dev layout. ai-ezio is public, so the default token is sufficient.
      - name: Checkout ai-whisper
        uses: actions/checkout@v5
        with:
          path: ai-whisper
          # Full history so the skills version-bump assertion can diff against
          # the PR base / push-before SHA without relying on a runtime fetch.
          fetch-depth: 0

      - name: Checkout ai-ezio (provides @ai-ezio/harness + @ai-ezio/protocol + @ai-ezio/surface)
        uses: actions/checkout@v5
        with:
          repository: ai-creed/ai-ezio
          path: ai-ezio
          # No submodules: the harness/protocol build is tsc-only and does not
          # need the vendored hax engine (that is a runtime dependency).

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ai-whisper/pnpm-lock.yaml
            ai-ezio/pnpm-lock.yaml

      - name: Build ai-ezio session-hosts + surface (pulls subagent + mcp-host + harness + protocol)
        working-directory: ai-ezio
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@ai-ezio/session-hosts..." --filter "@ai-ezio/surface..." build

      - name: Install dependencies
        working-directory: ai-whisper
        run: pnpm install --frozen-lockfile

      # Build before Lint: typescript-eslint's type-aware rules resolve
      # cross-package types from built dist/.d.ts (incl. the @ai-ezio packages),
      # so the workspace must be built first or lint reports unsafe-any errors.
      - name: Build
        working-directory: ai-whisper
        run: pnpm build

      - name: Lint
        working-directory: ai-whisper
        run: pnpm lint

      - name: Typecheck
        working-directory: ai-whisper
        run: pnpm typecheck

      - name: Test
        working-directory: ai-whisper
        run: pnpm -s test

      # Catches the ERR_MODULE_NOT_FOUND class where a bundle-externalized dep
      # is not declared in CLI dependencies (mirrors the publish gate).
      - name: Bundle self-containment smoke
        working-directory: ai-whisper
        run: node scripts/bundle-selfcontained-smoke.mjs

      # Skills QA (spec: docs/superpowers/specs/2026-07-12-bundled-skills-ownership-design.md).
      # Deterministic only — shakespii test runs WITHOUT --run/--triggers; live
      # trigger/grading sweeps stay manual calibration campaigns.
      - name: Skills QA — shakespii lint + deterministic test
        working-directory: ai-whisper
        run: |
          set -euo pipefail
          for d in packages/cli/skills/*/; do
            echo "== shakespii lint $d"
            pnpm exec shakespii lint "$d" --json
            echo "== shakespii test (deterministic) $d"
            pnpm exec shakespii test "$d" --json
          done

      # Changed skill content requires a version bump; unresolvable bases skip
      # visibly inside the script (first push, force push).
      - name: Skills QA — version-bump assertion
        working-directory: ai-whisper
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-skill-version-bump.mjs --base "$BASE_SHA"

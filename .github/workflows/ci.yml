name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: lint · build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      # ai-whisper depends on @ai-ezio/harness + @ai-ezio/protocol via
      # file:../ai-ezio/packages/* (see package.json). Both repos are checked out
      # side-by-side inside the workspace so those relative paths resolve, mirroring
      # the local dev layout. ai-ezio is public, so the default token is sufficient.
      - name: Checkout ai-whisper
        uses: actions/checkout@v5
        with:
          path: ai-whisper

      - name: Checkout ai-ezio (provides @ai-ezio/harness + @ai-ezio/protocol)
        uses: actions/checkout@v5
        with:
          repository: ai-creed/ai-ezio
          path: ai-ezio
          # No submodules: the harness/protocol build is tsc-only and does not
          # need the vendored hax engine (that is a runtime dependency).

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ai-whisper/pnpm-lock.yaml
            ai-ezio/pnpm-lock.yaml

      - name: Build ai-ezio harness + protocol
        working-directory: ai-ezio
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@ai-ezio/harness..." build

      - name: Install dependencies
        working-directory: ai-whisper
        run: pnpm install --frozen-lockfile

      # Build before Lint: typescript-eslint's type-aware rules resolve
      # cross-package types from built dist/.d.ts (incl. the @ai-ezio packages),
      # so the workspace must be built first or lint reports unsafe-any errors.
      - name: Build
        working-directory: ai-whisper
        run: pnpm build

      - name: Lint
        working-directory: ai-whisper
        run: pnpm lint

      - name: Typecheck
        working-directory: ai-whisper
        run: pnpm typecheck

      - name: Test
        working-directory: ai-whisper
        run: pnpm -s test
